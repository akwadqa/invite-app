# Native launch screen shown by the OS before Flutter starts.
# It only paints the animated splash's background color, so the hand-off to
# the Flutter SplashScreen is seamless.
# Regenerate after changes with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#DBE3E9"

  # Android 12+ always draws an icon on the launch screen; a fully transparent
  # image hides it so only the color shows. This file is only read by the
  # generator and is not bundled with the app.
  android_12:
    color: "#DBE3E9"
    image: assets/native_splash/android12_transparent.png

  android: true
  ios: true
  web: false
