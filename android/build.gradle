allprojects {
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        google()
        mavenCentral()
        maven { url "https://storage.googleapis.com/download.flutter.io" }
    }
}

buildscript {
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        google()
        mavenCentral()
    }
}

// Keep in sync with the plugin versions in settings.gradle.
def androidGradlePluginVersion = "9.3.1"
def kotlinGradlePluginVersion = "2.4.20"

// Some Flutter plugins pin older AGP/Kotlin versions in their own buildscript
// blocks. Those classes are never used (the versions from settings.gradle are
// loaded first), but Gradle would still download them just to resolve them,
// so point those requests at the versions this project already uses.
subprojects {
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def requested = details.requested
            if (requested.group == "com.android.tools.build" && requested.name == "gradle") {
                details.useVersion(androidGradlePluginVersion)
            } else if (requested.group == "org.jetbrains.kotlin" && requested.name == "kotlin-gradle-plugin") {
                details.useVersion(kotlinGradlePluginVersion)
            }
        }
    }
}

// Kotlin 2 fails the build when a module's Kotlin JVM target differs from its
// Java target. Some plugins (e.g. google_api_headers) leave Java on AGP's
// default but pin Kotlin to 1.8, so align Kotlin to each module's Java target.
subprojects { subproject ->
    subproject.pluginManager.withPlugin("org.jetbrains.kotlin.android") {
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach { task ->
            // Read lazily: AGP finalizes the Java target only when tasks run.
            task.compilerOptions.jvmTarget.set(subproject.provider {
                org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                    subproject.android.compileOptions.targetCompatibility.toString()
                )
            })
        }
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
